name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: macOS x86_64
            os: macos-15-intel
          - name: macOS ARM64
            os: macos-latest
          - name: Windows x86_64
            os: windows-2022

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install radare2
        id: r2
        uses: radareorg/github-actions@v3

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Run unit tests
        run: cargo test --locked

      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build release plugin
        run: cargo build --locked --release

      - name: Verify installed plugin
        if: runner.os != 'Windows'
        shell: bash
        run: |
          make install
          test -f "$(r2 -H R2_USER_PLUGINS)/libr2warp.$(r2 -H R2_LIBEXT)"
          r2 -q -c 'L~warp;zw?' /bin/ls

      - name: Package r2pm binary (bindist)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          make bindist
          for z in r2warp-*.zip; do shasum -a 256 "$z" > "$z.sha256"; done

      # Windows: compile/link/test coverage only for now. The r2warp.dll
      # crashing radare2 at plugin registration time (with r2 6.2.4) is
      # still under investigation, so no windows bindist zip ships yet.
      - name: Upload bindist artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: r2warp-${{ matrix.os }}
          path: |
            r2warp-*.zip
            r2warp-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: test-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: r2warp-*
          merge-multiple: true
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/r2warp-*.zip
            dist/r2warp-*.zip.sha256